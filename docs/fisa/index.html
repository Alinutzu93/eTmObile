<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Stadiul cererii</title>
<!--
  Fisa "la zi" pentru beneficiar (eTerra mobil).

  Linkul are forma  .../fisa/#<proiect-firebase>/<token>. Tot ce e dupa `#`
  ramane in browser: nu ajunge in jurnalele GitHub Pages. Pagina citeste un
  singur document Firestore (fise/<token>) prin API-ul REST public; regulile
  permit citirea unui document dupa token, dar nu si listarea colectiei.

  Zilele pana la termen (sau de la termen) se calculeaza AICI, la deschidere,
  deci "depasit cu N zile" e corect in orice zi. Starea insasi e cea de la
  ultima sincronizare a telefonului topografului - pagina spune si cand.
-->
<style>
  :root {
    --fundal: #f4f5f7; --card: #ffffff; --text: #1f2328; --gri: #626b76;
    --linie: #e3e6ea; --accent: #1e5a9c;
    --verde: #1f7a44; --verde-f: #e6f4ea;
    --portocaliu: #9a5b00; --portocaliu-f: #fff4e0;
    --rosu: #b3261e; --rosu-f: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundal: #0f1215; --card: #181c20; --text: #e6e8eb; --gri: #9aa3ad;
      --linie: #2a3036; --accent: #7fb2ec;
      --verde: #7bd39a; --verde-f: #16291d;
      --portocaliu: #f3b75a; --portocaliu-f: #2d2412;
      --rosu: #ff8a80; --rosu-f: #2f1714;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundal); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  .banda {
    background: var(--accent); color: #fff; border-radius: 16px;
    padding: 18px 20px; margin-bottom: 14px;
  }
  @media (prefers-color-scheme: dark) { .banda { color: #0f1215; } }
  .banda small { display: block; font-size: 12px; letter-spacing: .06em; opacity: .85; }
  .banda h1 { margin: 4px 0 0; font-size: 24px; font-weight: 700; }
  .stadiu { border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; }
  .stadiu b { display: block; font-size: 19px; margin-bottom: 4px; }
  .stadiu span { color: var(--text); opacity: .85; }
  .verde { background: var(--verde-f); } .verde b { color: var(--verde); }
  .portocaliu { background: var(--portocaliu-f); } .portocaliu b { color: var(--portocaliu); }
  .rosu { background: var(--rosu-f); } .rosu b { color: var(--rosu); }
  .card { background: var(--card); border-radius: 16px; padding: 4px 18px; }
  .rand { padding: 12px 0; border-bottom: 1px solid var(--linie); }
  .rand:last-child { border-bottom: 0; }
  .rand small {
    display: block; font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--gri);
  }
  .rand div { overflow-wrap: anywhere; }
  footer { color: var(--gri); font-size: 13px; margin-top: 16px; }
  footer p { margin: 6px 0; }
  .gol { text-align: center; padding: 48px 12px; color: var(--gri); }
  .gol b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
</style>
</head>
<body>
<main id="continut">
  <div class="gol"><b>Se încarcă…</b></div>
</main>
<script>
(function () {
  "use strict";
  var el = document.getElementById("continut");

  function gol(titlu, text) {
    el.innerHTML = "";
    var d = document.createElement("div");
    d.className = "gol";
    var b = document.createElement("b");
    b.textContent = titlu;
    d.appendChild(b);
    d.appendChild(document.createTextNode(text));
    el.appendChild(d);
  }

  var m = /^#([a-z0-9-]{4,40})\/([A-Za-z0-9_-]{20,40})$/.exec(location.hash);
  if (!m) {
    gol("Link incomplet", "Deschideți linkul exact așa cum l-ați primit.");
    return;
  }

  // Valorile tipizate ale API-ului REST Firestore -> valori JS.
  function val(v) {
    if (!v) return null;
    if ("stringValue" in v) return v.stringValue;
    if ("integerValue" in v) return Number(v.integerValue);
    if ("doubleValue" in v) return v.doubleValue;
    if ("booleanValue" in v) return v.booleanValue;
    if ("timestampValue" in v) return Date.parse(v.timestampValue);
    if ("arrayValue" in v) return (v.arrayValue.values || []).map(val);
    return null;
  }

  function zi(ms) {
    var d = new Date(ms);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function data(ms) {
    return ms > 0 ? new Date(ms).toLocaleDateString("ro-RO",
      { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
  }
  function dataOra(ms) {
    return ms > 0 ? new Date(ms).toLocaleString("ro-RO",
      { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
  }
  function zile(n) { return n === 1 ? "o zi" : n + " zile"; }

  /** Titlul, explicatia si culoarea cartusului de stadiu. */
  function stadiu(f) {
    var stare = (f.stare || "").toLowerCase();
    var alerta = f.alerta || (stare.indexOf("complet") >= 0 ? "COMPLETARE"
      : stare.indexOf("respin") >= 0 ? "RESPINGERE" : "");
    if (alerta === "RESPINGERE") return ["Cererea a fost respinsă",
      "Topograful va discuta cu dvs. pașii următori.", "rosu"];
    if (f.solutionata) return ["Cererea este soluționată",
      "Documentele au fost emise de OCPI.", "verde"];
    if (alerta === "COMPLETARE") return ["OCPI a cerut completarea dosarului",
      "Topograful pregătește completarea; termenul se reia după depunerea ei.", "portocaliu"];
    if (!(f.termen > 0)) return ["Cererea este în lucru la OCPI",
      "Termenul de soluționare nu a fost comunicat încă.", "portocaliu"];
    var n = Math.round((zi(f.termen) - zi(Date.now())) / 86400000);
    var t = "Termen: " + data(f.termen);
    if (n < 0) return ["Termen depășit cu " + zile(-n),
      t + ". Lucrarea este încă în analiză la OCPI.", "rosu"];
    if (n === 0) return ["Termenul este astăzi", t + ". Lucrarea este în lucru la OCPI.", "portocaliu"];
    if (n === 1) return ["Termenul este mâine", t + ". Lucrarea este în lucru la OCPI.", "portocaliu"];
    return ["Mai sunt " + zile(n) + " până la termen", t + ". Lucrarea este în lucru la OCPI.", "verde"];
  }

  function adauga(parinte, tag, clasa, text) {
    var e = document.createElement(tag);
    if (clasa) e.className = clasa;
    if (text != null) e.textContent = text;
    parinte.appendChild(e);
    return e;
  }

  function arata(f) {
    el.innerHTML = "";
    var banda = adauga(el, "div", "banda");
    adauga(banda, "small", null, "STADIUL CERERII DVS. LA OCPI");
    adauga(banda, "h1", null, "Cererea nr. " + (f.numar || "—"));

    var s = stadiu(f);
    var c = adauga(el, "div", "stadiu " + s[2]);
    adauga(c, "b", null, s[0]);
    adauga(c, "span", null, s[1]);

    var card = adauga(el, "div", "card");
    var randuri = [
      ["Beneficiar", f.beneficiar],
      ["Tipul lucrării", f.tip],
      ["Stadiu în eTerra", f.stare],
      ["Localitate (UAT)", f.uat],
      [(f.imobile || []).length > 1 ? "Imobile (nr. cadastral / IE)" : "Imobil (nr. cadastral / IE)",
        (f.imobile || []).join(", ")],
      ["Depusă la", [f.birou, data(f.dataDepunere)].filter(Boolean).join(", ")],
      ["Număr de depunere online", f.numarOnline]
    ];
    randuri.forEach(function (r) {
      if (!r[1]) return;
      var d = adauga(card, "div", "rand");
      adauga(d, "small", null, r[0]);
      adauga(d, "div", null, r[1]);
    });

    var sub = adauga(el, "footer");
    if (f.intocmitDe) adauga(sub, "p", null, "Întocmit de: " + f.intocmitDe);
    var verif = f.verificat || f.actualizat;
    if (verif) adauga(sub, "p", null, "Stadiu verificat în eTerra (ANCPI) la " + dataOra(verif) + ".");
    adauga(sub, "p", null, "Termenul poate fi prelungit de OCPI; stadiul se poate schimba.");
  }

  var url = "https://firestore.googleapis.com/v1/projects/" + m[1] +
    "/databases/(default)/documents/fise/" + m[2];
  fetch(url, { referrerPolicy: "no-referrer" })
    .then(function (r) {
      if (r.status === 404) throw { gol: true };
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (doc) {
      var f = {};
      Object.keys(doc.fields || {}).forEach(function (k) { f[k] = val(doc.fields[k]); });
      if (f.expira && f.expira < Date.now()) throw { gol: true };
      arata(f);
    })
    .catch(function (e) {
      if (e && e.gol) gol("Link expirat",
        "Fișa nu mai este disponibilă. Cereți topografului un link nou, dacă e nevoie.");
      else gol("Nu am putut încărca stadiul",
        "Verificați conexiunea la internet și reîncărcați pagina.");
    });
})();
</script>
</body>
</html>
